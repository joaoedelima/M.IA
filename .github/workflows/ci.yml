name: CI

on:
  pull_request:
  push:
    branches: ["main", "work"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check server.js
